[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "brack-cli"
version = "1.0.0"
description = "Brack CLI — Personal Git Hosting & AI Coding Platform"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "keyring>=24.3.0",
    "gitpython>=3.1.40",
]

[project.scripts]
brack = "brack.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["brack*"]
